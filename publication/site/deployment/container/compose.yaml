services:
  docs:
    build:
      context: ../../..
      dockerfile: publication/site/deployment/container/Dockerfile
    image: monad-engineering-log:local
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      MONAD_DEPLOYMENT_TARGET: container
      MONAD_BUILD_CHANNEL: local
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
