name: Documentation Production

on:
  push:
    branches: [main]
    paths:
      - 'publication/site/**'
      - 'journal/**'
      - 'architecture/**'
      - 'adrs/**'
      - 'specifications/**'
      - 'engineering/**'
      - 'research/**'
      - 'knowledge/**'
      - 'build-log/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  production:
    if: ${{ vars.MONAD_DOCS_PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: docs-production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: publication/site
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      MONAD_BUILD_COMMIT: ${{ github.sha }}
      MONAD_BUILD_CHANNEL: production
      MONAD_DEPLOYMENT_TARGET: vercel
      MONAD_SECURITY_HSTS: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify:release
      - run: bunx vercel@56.5.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: bunx vercel@56.5.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production
        run: |
          url=$(bunx vercel@56.5.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "## Documentation production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
