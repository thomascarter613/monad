version: 2
updates:
  - package-ecosystem: npm
    directory: /publication/site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      documentation-runtime:
        patterns: ["fumadocs-*", "next", "react", "react-dom"]
      documentation-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
